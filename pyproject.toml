[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "zebracat"
dynamic = ["version"]
description = "Official Python client for the Zebracat video API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Zebracat" }]
keywords = ["zebracat", "video", "ai", "api", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24,<1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://zebracat.ai"
Documentation = "https://api.zebracat.ai/docs"
Source = "https://github.com/zebracatai/zebracat-python"

[tool.hatch.version]
path = "src/zebracat/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zebracat"]

[tool.hatch.build.targets.sdist]
include = ["src/zebracat", "tests", "scripts", "openapi", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
